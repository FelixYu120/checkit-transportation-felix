[platformio]
default_envs = radar_connected

[common]
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -D SERIAL_BAUD=115200
  -D CORE_DEBUG_LEVEL=1
lib_ldf_mode = deep+

[env:radar_node]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
lib_ldf_mode = ${common.lib_ldf_mode}
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = app3M_fat9M_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
build_flags =
  ${common.build_flags}
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D BOARD_HAS_PSRAM
build_src_filter =
  +<radar_node/>
  -<flash_node/>
  -<ld2451_bench/>
  -<ld2415h_reference/>

[env:flash_node]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
lib_ldf_mode = ${common.lib_ldf_mode}
build_flags = ${common.build_flags}
build_src_filter =
  +<flash_node/>
  -<radar_node/>
  -<ld2451_bench/>
  -<ld2415h_reference/>

[env:ld2451_bench]
; Same H606 flash/PSRAM and platform as the combined firmware.
; Original raw UART reader used by the working radar-only pair; no commands.
extends = env:radar_node
build_src_filter =
  -<*>
  +<ld2451_bench/>

[env:ld2415h_reference]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
lib_ldf_mode = ${common.lib_ldf_mode}
board_build.partitions = default.csv
build_flags = ${common.build_flags}
build_src_filter =
  +<ld2415h_reference/>
  -<radar_node/>
  -<flash_node/>
  -<ld2451_bench/>

[env:native]
platform = native
test_framework = unity
lib_ldf_mode = ${common.lib_ldf_mode}
build_flags =
  -std=gnu++17

; Temporary two-module control/chain test. No radar, Wi-Fi, or provisioning.
[env:lonely_binary_bench]
extends = env:radar_node
build_src_filter =
  -<*>
  +<lonely_binary_bench/>

; Explicit indoor override: compiled hotspot and 5 km/h sign threshold.
; Saved app provisioning is retained; do not use this image for field operation.
[env:radar_node_room_test]
extends = env:radar_node
build_flags =
  ${env:radar_node.build_flags}
  -D CHECKIT_SPEED_DISPLAY_ROOM_TEST=1

; Original bench reader with the display-only addon enabled.
; Local phone dashboard; no sensor writes, reference UART, provisioning, cloud, matrix, or speaker.
[env:radar_display_test]
extends = env:ld2451_bench
build_flags =
  ${env:radar_node.build_flags}
  -D CHECKIT_RADAR_DISPLAY_ADDON=1

; Working radar/display path plus logistics-app BLE commissioning and cloud.
[env:radar_connected]
extends = env:radar_display_test
build_flags =
  ${env:radar_display_test.build_flags}
  -D CHECKIT_RADAR_CLOUD_ADDON=1
  -I include
  -D CHECKIT_FIRMWARE_VERSION=\"3.1.0-lean\"
