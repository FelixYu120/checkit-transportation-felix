[platformio]
default_envs = radar_node, flash_node

[common]
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -D SERIAL_BAUD=115200
  -D CORE_DEBUG_LEVEL=1
lib_ldf_mode = deep+

[env:radar_node]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
lib_ldf_mode = ${common.lib_ldf_mode}
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = app3M_fat9M_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
build_flags =
  ${common.build_flags}
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D BOARD_HAS_PSRAM
build_src_filter =
  +<radar_node/>
  -<flash_node/>
  -<ld2451_bench/>
  -<ld2415h_reference/>

[env:flash_node]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
lib_ldf_mode = ${common.lib_ldf_mode}
build_flags = ${common.build_flags}
build_src_filter =
  +<flash_node/>
  -<radar_node/>
  -<ld2451_bench/>
  -<ld2415h_reference/>

[env:ld2451_bench]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
  +<ld2451_bench/>
  -<radar_node/>
  -<flash_node/>
  -<ld2415h_reference/>

[env:ld2415h_reference]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
lib_ldf_mode = ${common.lib_ldf_mode}
board_build.partitions = default.csv
build_flags = ${common.build_flags}
build_src_filter =
  +<ld2415h_reference/>
  -<radar_node/>
  -<flash_node/>
  -<ld2451_bench/>

[env:native]
platform = native
test_framework = unity
lib_ldf_mode = ${common.lib_ldf_mode}
build_flags =
  -std=gnu++17
