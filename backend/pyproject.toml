[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "checkit-transportation"
version = "0.1.0"
description = "Safe archival and aggregation tools for CheckIt Transportation V2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35,<2",
  "psycopg[binary]>=3.2,<4",
  "pyarrow>=17,<22",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["integration: requires live Supabase and/or R2 credentials"]
